<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지원자–공고 매칭 스코어링 — 결과 확인</title>
<style>
:root{
  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
  --bg:#F6F8F9;--surface:#FFFFFF;--sunken:#EFF2F4;--line:#E8EAEC;--lineStrong:#DBDEE1;
  --text:#2B2F36;--text2:#6A7077;--text3:#979CA2;
  --brand:#16A06B;--brandStrong:#138A5C;--brandPress:#117A52;--brand100:#E6F7EF;--brand200:#CFEFE0;--brandSoft:#F1FBF6;--onBrand:#FFFFFF;--textOnTint:#2E6B4E;
  --danger:#D14B3A;--danger100:#F9E7E3;--warning:#C9912B;--warning100:#F7EFDB;--info:#4A86C5;--info100:#E5EFF8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1A1D22;--surface:#23272D;--sunken:#1F2329;--line:#353A41;--lineStrong:#444A52;
  --text:#EEF0F2;--text2:#A9AFB6;--text3:#7B818A;
  --brand:#3DC88C;--brandStrong:#52D69B;--brandPress:#35B27C;--brand100:#1E3A2E;--brand200:#274A39;--brandSoft:#15291F;--onBrand:#07140E;--textOnTint:#9EDCBE;
  --danger:#E0685A;--danger100:#3A2622;--warning:#E6B257;--warning100:#3A3322;--info:#6BA0D6;--info100:#22303D;
}}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
a{color:var(--brandStrong)}a:hover{color:var(--brandPress)}
button{font-family:var(--font)}
code,.mono{font-family:var(--mono)}
.wrap{max-width:1360px;margin:0 auto;padding:20px 24px 60px}
header.app{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
header.app h1{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:0}
.hsub{font-size:12px;color:var(--text3)}
/* hidden 속성이 class의 display를 이긴다. 브라우저 기본 [hidden]{display:none}은
   우선순위가 가장 낮아 .mockbar{display:flex} 같은 규칙에 조용히 진다 — 그러면
   `?mock=1` 없이 실서버에 붙었는데도 「샘플 데이터」 띠가 떠서 **진짜 결과가 가짜로
   보인다.** 화면이 거짓말하지 않게 하는 것이 이 한 줄이다. */
[hidden]{display:none !important}
/* 샘플 데이터 경고 띠 — 화면 최상단. 목업이 진짜처럼 보이면 화면이 거짓말하는 것이다 */
.mockbar{position:sticky;top:0;z-index:50;background:var(--danger);color:#fff;padding:9px 16px;
  font-size:13px;font-weight:700;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  border-bottom:3px solid rgba(0,0,0,.25)}
.mockbar .sub{font-weight:500;font-size:12px;opacity:.92}
.mockbar .x{margin-left:auto;font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.22);
  border-radius:999px;padding:3px 10px}
/* 상시 범례 — 배지의 뜻을 화면 안에 둔다 */
.legendbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;font-size:12px;color:var(--text2)}
.legendfold{margin-bottom:12px}
.legendfold>summary{padding:7px 14px;font-size:12px;font-weight:600;color:var(--text2)}
/* stepper */
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 7px;font-size:12.5px;font-weight:600;color:var(--text3);cursor:default}
.step .n{width:20px;height:20px;border-radius:999px;background:var(--sunken);color:var(--text3);display:grid;place-items:center;font-size:11px;font-weight:700}
.step.visited{color:var(--text2);cursor:pointer}
.step.visited:hover{border-color:var(--lineStrong)}
.step.visited .n{background:var(--brand100);color:var(--textOnTint)}
.step.current{border-color:var(--brand);color:var(--text)}
.step.current .n{background:var(--brand);color:var(--onBrand)}
.step.gatestep{border-style:dashed;border-color:var(--warning)}
.step.gatestep.current{border-style:solid;border-color:var(--brand)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.3px;margin:0 0 6px}
.card .desc{font-size:12.5px;color:var(--text2);margin:0 0 16px}
/* badges — 두 계열은 색·모양 모두 다르게: 근거등급=각진 모노 아웃라인, 검토상태=둥근 pill 채움 */
.eg{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;border:1px solid var(--lineStrong);border-radius:4px;padding:1px 5px;color:var(--text2);cursor:help;line-height:1.4}
.eg.E2{border-color:var(--brand);color:var(--brandStrong)}
.eg.E1{border-color:var(--info);color:var(--info)}
.eg.E0{border-color:var(--warning);color:var(--warning)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;line-height:1.45;white-space:nowrap}
.chip .dot{width:5px;height:5px;border-radius:3px;background:currentColor;flex:none}
.chip.warn{background:var(--warning100);color:var(--warning)}
.chip.ok{background:var(--brand100);color:var(--textOnTint)}
.chip.danger{background:var(--danger100);color:var(--danger)}
.chip.info{background:var(--info100);color:var(--info)}
.chip.neutral{background:var(--sunken);color:var(--text2)}
.kindtag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.kindtag.required{background:var(--danger100);color:var(--danger)}
.kindtag.preferred{background:var(--info100);color:var(--info)}
.kindtag.gate{background:var(--warning100);color:var(--warning)}
.kindtag.duty{background:var(--sunken);color:var(--text2)}
/* buttons */
.btn{border:1px solid var(--lineStrong);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--onBrand);font-weight:700}
.btn.primary:hover{background:var(--brandStrong)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* banners */
.banner{border-radius:12px;padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.banner.warn{background:var(--warning100);color:var(--warning)}
.banner.danger{background:var(--danger100);color:var(--danger)}
.banner.info{background:var(--info100);color:var(--info)}
.banner b{font-weight:700}
/* 점검용 한 줄 (② ④ 상단) */
.inspect{display:flex;gap:8px;align-items:center;background:var(--sunken);border:1px dashed var(--lineStrong);
  border-radius:10px;padding:7px 12px;font-size:12px;color:var(--text2);margin-bottom:12px}
.inspect b{color:var(--text3);font-weight:700;font-size:11px;letter-spacing:.3px}
/* 승인 게이트 — 점검용 서랍과 반대 톤. 이 화면이 다른 무게를 갖는다는 표시다 */
.gatenote{border:2px solid var(--brand);background:var(--brand100);border-radius:12px;padding:11px 16px;
  font-size:13.5px;color:var(--textOnTint);margin-bottom:12px}
.gatenote b{font-weight:800}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:11px;font-weight:700;color:var(--text3);padding:6px 8px;border-bottom:1px solid var(--lineStrong);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* image viewer */
.iv{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--sunken);overflow:auto;overscroll-behavior:contain}
.iv .stage{position:relative}
.iv img{display:block;width:100%;height:auto}
.ivbox{position:absolute;border:1.5px solid;border-radius:2px;cursor:pointer}
.ivbox.header{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 16%,transparent)}
.ivbox.item{border-color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.ivbox.duty{border-color:var(--text3);background:color-mix(in srgb,var(--text3) 16%,transparent)}
.ivbox.continuation{border-color:var(--info);border-style:dashed;background:color-mix(in srgb,var(--info) 7%,transparent)}
.ivbox.ambiguous{border-color:var(--warning);background:color-mix(in srgb,var(--warning) 18%,transparent)}
.ivbox.outscope{border-color:var(--text3);background:color-mix(in srgb,var(--text3) 12%,transparent)}
.ivbox.sel{outline:3px solid var(--danger);outline-offset:2px;z-index:3}
.ivmark{position:absolute;border:2.5px solid var(--danger);border-radius:3px;
  background:color-mix(in srgb,var(--danger) 10%,transparent);pointer-events:none;z-index:4}
.ivband{position:absolute;left:0;right:0;border-top:2px dashed var(--brandStrong);border-bottom:2px dashed var(--brandStrong);background:color-mix(in srgb,var(--brand) 4%,transparent);pointer-events:none}
.ivband .lbl{position:absolute;top:4px;left:6px;font-size:11px;font-weight:700;color:var(--onBrand);background:var(--brandStrong);border-radius:6px;padding:2px 8px}
/* legend chips */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--text2);cursor:pointer;user-select:none}
.lg .sw{width:10px;height:10px;border-radius:3px;border:1.5px solid}
.lg.off{opacity:.38}
/* line list */
.linelist{border:1px solid var(--line);border-radius:12px;overflow:auto;font-size:12px}
.ll{display:grid;grid-template-columns:56px 44px 40px 46px 78px 1fr;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.ll:hover{background:var(--sunken)}
.ll.sel{background:var(--brand100)}
.ll .mono{font-size:11px;color:var(--text3)}
.ll .txt{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.ll .role{font-size:11px;font-weight:700}
.llh{position:sticky;top:0;background:var(--surface);font-size:10.5px;font-weight:700;color:var(--text3);border-bottom:1px solid var(--lineStrong);cursor:default}
.llh:hover{background:var(--surface)}
/* criteria rows */
.crit{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--surface)}
.crit.deleted{opacity:.5}
.crit .head{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.crit .rtext{flex:1 1 280px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;line-height:1.6;cursor:pointer}
.crit .rtext:hover{color:var(--brandStrong)}
.crit .acts{display:flex;gap:6px;flex:none}
.crit .more{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--text2)}
.anchor{display:grid;grid-template-columns:26px 1fr;gap:8px;margin-top:4px}
.anchor .k{font-family:var(--mono);font-weight:700;color:var(--text3)}
/* ranking */
.rank{display:grid;grid-template-columns:52px 64px 64px minmax(120px,1fr) 220px;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:7px;cursor:pointer}
.rank:hover{border-color:var(--brand)}
.rank .rk{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.rank .cid{font-family:var(--mono);font-weight:700}
.rank .tot{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:14px;border-radius:7px;background:var(--sunken);overflow:hidden;display:flex}
.bar .f{background:var(--brandStrong)}
.bar .j{background:var(--brand200)}
.axes{font-family:var(--mono);font-size:11.5px;color:var(--text2);white-space:nowrap}
@media (max-width:760px){.rank{grid-template-columns:52px 1fr;row-gap:6px}.rank .tot{text-align:left}}
/* resume panel */
.resume{font-family:var(--mono);font-size:12px;line-height:1.8;white-space:pre-wrap;word-break:break-all;background:var(--sunken);border-radius:12px;padding:14px;overflow:auto}
.resume mark{background:var(--warning100);color:inherit;border-radius:3px;padding:0 1px}
.resume mark.hot{background:var(--brand200);outline:2px solid var(--brand)}
.qlink{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:3px 9px;font-size:11.5px;font-family:var(--mono);cursor:pointer;color:var(--text2);text-align:left}
.qlink:hover{border-color:var(--brand);color:var(--brandStrong)}
/* progress */
.stages{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;max-width:420px}
.stages li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text3)}
.stages li .ic{width:22px;height:22px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px}
.stages li.doing{color:var(--text);font-weight:600}
.stages li.doing .ic{border-color:var(--brand);animation:pulse 1.1s ease-in-out infinite}
.stages li.done{color:var(--text2)}
.stages li.done .ic{border-color:var(--brand);background:var(--brand);color:var(--onBrand)}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--brand100)}}
.radio{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;margin-bottom:8px;background:var(--surface)}
.radio:hover{border-color:var(--lineStrong)}
.radio.sel{border-color:var(--brand);background:var(--brandSoft)}
.radio input{margin-top:3px;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:minmax(340px,5fr) minmax(320px,4fr);gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.grid2b{display:grid;grid-template-columns:minmax(360px,3fr) minmax(300px,2fr);gap:16px}
@media (max-width:980px){.grid2b{grid-template-columns:1fr}}
.sect{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--text3);margin:18px 0 8px}
.kv{font-size:12px;color:var(--text2)}
.kv b{color:var(--text)}
.diag{font-family:var(--mono);font-size:11.5px;color:var(--text2);background:var(--sunken);border-radius:10px;padding:8px 12px;margin-top:10px;line-height:1.7;word-break:break-all}
.diag .bad{color:var(--danger);font-weight:700}
.miss{color:var(--text3);font-style:normal}
.errpane{border:1px solid var(--danger);border-radius:16px;background:var(--danger100);padding:24px;color:var(--danger)}
.errpane h2{margin:0 0 8px;font-size:16px}
.errpane pre{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;color:var(--text2);background:var(--surface);border-radius:10px;padding:12px;margin:12px 0 0;overflow:auto}
.footctas{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.rationale{font-size:12.5px;color:var(--text2);background:var(--sunken);border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.minibar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;min-width:70px}
.minibar i{display:block;height:100%;background:var(--brand)}
/* 서랍 — 「보는 것」은 화면이 아니라 여기 들어간다. 머리말이 안에 든 것을 숫자로 예고한다 */
details.drawer{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:14px;overflow:hidden}
details.drawer>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:13.5px;font-weight:700}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary:hover{background:var(--sunken)}
details.drawer>summary .tri{color:var(--text3);font-size:11px;transition:transform .15s}
details.drawer[open]>summary .tri{transform:rotate(90deg);display:inline-block}
details.drawer>summary .hint{font-weight:500;font-size:11.5px;color:var(--text2);font-family:var(--mono)}
details.drawer[open]>summary{border-bottom:1px solid var(--line)}
.drawerbody{padding:16px}
/* 랭킹 아코디언 — 여러 명이 동시에 열린다. 비교가 이 화면의 목적이다 */
.rankwrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:7px}
.rankwrap:hover{border-color:var(--brand)}
.rankwrap .rank{border:0;margin:0;background:transparent}
.rankwrap .rank.open{border-bottom:1px solid var(--line);border-radius:0}
.acc{padding:0 14px 14px}
/* 업로드 화면 — 입력 폼 · 드롭존. 새로 만든 것은 여기 아래뿐이고 위는 손대지 않았다 */
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px}
.hint{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.6}
.tin{width:100%;border:1px solid var(--lineStrong);background:var(--surface);color:var(--text);
  border-radius:10px;padding:8px 11px;font-size:13px;font-family:var(--font)}
.tin:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input.tin.mono{font-family:var(--mono)}
textarea.tin{min-height:150px;line-height:1.7;resize:vertical;font-family:var(--mono);font-size:12px}
.drop{border:2px dashed var(--lineStrong);border-radius:14px;background:var(--sunken);padding:22px 18px;
  text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brandSoft)}
.drop .big{font-size:13.5px;font-weight:700}
.filerow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:7px 11px;border:1px solid var(--line);
  border-radius:10px;margin-top:6px;font-size:12px}
.filerow .nm{font-family:var(--mono);word-break:break-all;flex:1 1 180px}
.filerow.bad{border-color:var(--danger);background:var(--danger100)}
.estbox{border:2px solid var(--brand);background:var(--brandSoft);border-radius:12px;padding:12px 15px;
  margin-top:12px;font-size:12.5px;color:var(--text);line-height:1.7}
.estbox .big{font-size:17px;font-weight:800;color:var(--brandStrong);font-variant-numeric:tabular-nums}
.rescard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.rescard .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rescard .top .grow{flex:1 1 150px}
</style>
</head>
<body>
<div id="mockbar" class="mockbar" hidden>
  <span>⚠ 샘플 데이터 — 실제 채점 결과가 아닙니다</span>
  <span class="x">?mock=1 — 주소에서 빼면 실서버에 붙습니다</span>
</div>
<div class="wrap">
  <header class="app">
    <h1>지원자–공고 매칭 스코어링</h1>
    <span class="hsub" id="opsline">실제 운영에서 사람이 확인하는 자리는 조건 승인 한 곳이다</span>
  </header>
  <!-- 배지 뜻은 툴팁으로만 둔다. 펼쳐 두지 않고 접어 둔다 -->
  <details class="drawer legendfold">
    <summary><span class="tri">▸</span>배지 뜻</summary>
    <div class="legendbar">
      <span class="eg E2" title="E2 — 공고에 명시된 조건">E2</span>
      <span class="eg E1" title="E1 — 공고 구조에서 추론한 조건">E1</span>
      <span class="eg E0" title="E0 — 근거가 약한 조건">E0</span>
      <span class="chip ok" title="사람 확인함 — 고객사가 이 조건을 승인함"><span class="dot"></span>사람 확인함</span>

let LAST_OPTIONAL_MISS = null;
async function apiOptional(path){

function reqIndex(list){ const m=new Map(); for(const r of (list||[])) m.set(r.id,r); return m; }
function splitCriteria(P){
  const idx = reqIndex(P && P.requirements);
  const conds=[], duties=[];
  for (const c of ((P&&P.criteria)||[])){
    const r = idx.get(c.requirement_id);
    ((r && r.kind==="duty") ? duties : conds).push(c);
  }
  return {idx, conds, duties};
}
/* 줄 → 조건 역참조. `Requirement.line_ids`는 결과에 실리지 않으므로(pipeline/run.py의
   `_plain_requirement`) 그래프의 `extracted_from` Link에서 만든다. dst는 `kt-b2c:L-084` 꼴이다. */
function lineReqMap(graph){
  const m=new Map();
  for (const l of ((graph&&graph.links)||[])){
    if (l.rel!=="extracted_from") continue;
    const raw=String(l.dst); const lid = raw.includes(":") ? raw.slice(raw.lastIndexOf(":")+1) : raw;
    if (!m.has(lid)) m.set(lid, l.src);
  }

}

/* GET /trace 응답 정규화. 키가 빠져도 화면이 서야 한다 — 빈 칸 대신 「없음」을 적는다. */
function normalizeTrace(raw, graph){

/* 실제 RunResult와 같은 키로 만든다 — `gated` 배열은 없다. 탈락자는 ranked 안에 rank:null 로 있다 */
function buildMockRun(pid){
  const P=MOCK.prepare[pid];
  const crit=P.criteria.filter(c=>!c._deleted);
  const ids = pid==="kt-b2c" ? ["A-01","A-02","A-03","A-04","A-05","A-06"] : ["B-01","B-02","B-03","B-04","B-05","B-06"];
  const evAll=[], scores=[], links=P.graph.links.slice();
  const ranked=[];
  ids.forEach((cid,ci)=>{
    const bd=[]; let gateFail=null;
    crit.forEach((c,k)=>{
      let raw;
      if (c.layer==="gate") raw = (ci===5 ? 0 : 1);
      else if (c.layer==="fact") raw = ((ci+k)%3===0)?0:1;
      else raw = 1 + ((ci*3+k*2)%9)/2;
      const unit = c.layer==="judgment" ? (raw-1)/4 : raw;
      const sid = `S-${cid}-${c.id}`;
      const evs=[];
      if (c.layer!=="gate" && raw>0){
        const body=MOCK.resumes[cid].text;
        const start=Math.min(body.length-20, 60+((ci*37+k*53)%Math.max(1,body.length-120)));
        const quote=body.slice(start, Math.min(body.length, start+42));
        const e={id:`E-${cid}-${c.id}-01`, resume_id:cid, span:{start, end:start+quote.length}, quote};
        evAll.push(e); evs.push(e.id);
        links.push({src:sid, rel:"grounded_in", dst:e.id});
        links.push({src:e.id, rel:"supports", dst:c.id});
      }
      scores.push({id:sid, criterion_id:c.id, candidate_id:cid, value:raw, layer:c.layer,
        judge_id:(c.layer==="judgment"?"panel-2":null),
        rationale:`(샘플) ${c.label} — 원점수 ${raw}`});
      links.push({src:sid, rel:"derived_from", dst:c.id});
      if (c.layer==="gate" && raw<=0) gateFail={id:c.id, reason:"(샘플) 면허 확인 불가 — 게이트 조건 불충족"};
      bd.push({criterion_id:c.id, label:c.label, layer:c.layer, raw:+raw.toFixed(4),
        weighted:+(c.weight*unit).toFixed(6), max_weighted:c.weight,
        rationale:`(샘플) ${c.label}의 근거 문단. 실제 화면에서는 그래프를 따라가며 만든 문단이 들어갑니다.`,
        evidence_ids:evs, evidence_grade:"E2", review_status:c.review_status});
    });
    const total=+bd.reduce((a,x)=>a+x.weighted,0).toFixed(6);
    ranked.push({candidate_id:cid, total, rank:0,
      gate:{passed:!gateFail, failed_criteria:gateFail?[gateFail.id]:[], reasons:gateFail?[gateFail.reason]:[]},
      breakdown:bd, graph_ref:"mock"});
  });
  const passed=ranked.filter(c=>c.gate.passed).sort((a,b)=>b.total-a.total);
  passed.forEach((c,i)=>c.rank=i+1);
  const failed=ranked.filter(c=>!c.gate.passed); failed.forEach(c=>c.rank=null);
  const unapproved = P.approved_at==null;
  return {run_id:"mock-"+pid+"-"+Date.now().toString(36), posting_id:pid, source_kind:P.source_kind,
    created_at:new Date().toISOString(),
    ranked:passed.concat(failed),
    graph:{requirements:P.graph.requirements, criteria:P.criteria, evidence:evAll, scores, links},
    unapproved, approved_at:P.approved_at, approved_by:P.approved_by,
    posting_revision:P.posting_revision, revision_checked:false,
    cost:{calls:0, in_tokens:0, out_tokens:0, usd:0, priced:false, model:"(샘플 — 호출 없음)"},
    parse_report:P.parse_report};
}
async function mockApi(path, opts){
  await new Promise(r=>setTimeout(r, path==="/score"?2600:220));
  if (path==="/postings") return structuredClone(MOCK.postings);
  if (path==="/prepare"){ const P=MOCK.prepare[opts.body.posting_id]; if(!P) throw new ApiError(404,{detail:"mock: 없는 공고"});
    const out=structuredClone(P); delete out._lines; return out; }
  if (path.startsWith("/trace/")) { const t=MOCK.trace[decodeURIComponent(path.slice(7))]; if(!t) throw new ApiError(404,{detail:"mock: trace 없음"}); return structuredClone(t); }
  if (path.startsWith("/resume/")){
    const id=decodeURIComponent(path.slice(8).split("?")[0]);
    const r=MOCK.resumes[id]; if(!r) throw new ApiError(404,{detail:"mock: 이력서 없음"});
    return structuredClone(r);
  }
  if (path==="/approve"){
    const P=MOCK.prepare[opts.body.posting_id]; const out=[];
    for (const d of opts.body.decisions){
      const c=P.criteria.find(x=>x.id===d.criterion_id); if(!c) continue;
      const req=P.requirements.find(r=>r.id===c.requirement_id);
      if (d.action==="flip"){
        if (!req || (req.kind!=="required" && req.kind!=="preferred"))
          throw new ApiError(400,{detail:`${c.id}: ${req?req.kind:"?"} 조건은 뒤집을 수 없다 — 필수↔우대만 뒤집는다`});
        req.kind = req.kind==="required"?"preferred":"required";
      }
      if (d.action==="delete") c._deleted=true;
      c.review_status="human_validated";
      out.push({criterion_id:c.id, requirement_id:c.requirement_id, kind:req?req.kind:"required",
        review_status:c.review_status, deleted:!!c._deleted});
    }
    P.approved_at=new Date().toISOString(); P.approved_by="승인 화면 (샘플)";
    return {approved_at:P.approved_at, criteria:out};
  }
  if (path==="/score"){
    const run=buildMockRun(opts.body.posting_id);
    try{ const m=JSON.parse(sessionStorage.getItem("ase.mockRuns")||"{}"); m[run.run_id]=run; sessionStorage.setItem("ase.mockRuns",JSON.stringify(m)); }catch(e){}
    return structuredClone(run);
  }
  if (path.startsWith("/runs/")){
    const m=JSON.parse(sessionStorage.getItem("ase.mockRuns")||"{}"); const r=m[decodeURIComponent(path.slice(6))];
    if(!r) throw new ApiError(404,{detail:"mock: 저장된 결과 없음"});
    return structuredClone(r);
  }
  throw new ApiError(404,{detail:"mock: 모르는 경로 "+path});
}

function canEnter(n){

     막아 두면 저장된 결과를 불러온 뒤 승인 화면으로 갈 길이 아예 없어진다. */
  if (n===3 && !S.run) return false;
  return true;
}
/* 업로드 흐름은 ①의 곁가지다. 단계 칩을 누르면 **그 흐름에서 빠져나온다** —
   안 지우면 「공고 고르기」를 눌러도 업로드 화면이 그대로 남아 갇힌 것처럼 보인다. */
function go(n){ S.up=null; S.step=n; S.visited.add(n); render(); }
function render(){
  renderStepper(); view.textContent="";
  try{ [v1,v2,v3][S.step-1](); }catch(e){ console.error(e); renderError(e); }
}
function renderError(e){
  view.textContent="";
  const st=e instanceof ApiError?e.status:null;
  const MSG={400:"요청이 거부됐습니다. 아래 사유를 확인하세요.",
    404:"경로 또는 자원을 찾을 수 없습니다. 서버에 그 엔드포인트가 있는지 확인하세요.",
    /* 405는 「경로는 있는데 그 방식은 안 받는다」다. `POST /postings`가 아직 없는 서버에서
       `GET /postings`만 있으면 FastAPI가 정확히 이 값을 준다 — 없는 API를 부른 것이지
       화면이 깨진 것이 아니라는 말을 여기서 해 준다. */
    405:"서버가 그 경로에서 이 요청 방식을 받지 않습니다 — 업로드 엔드포인트가 아직 없을 수 있습니다.",
    422:"검산 위반 — 근거 없는 점수를 내보내지 않습니다. 결과 전체를 표시하지 않습니다. 아래 위반 목록을 확인하세요.",
    503:"공고 원본에 접근할 수 없습니다.",429:"호출 예산을 초과했습니다. 잠시 후 다시 시도하세요.",
    409:"승인이 없거나 낡았습니다 — 조건을 (다시) 승인해야 채점이 시작됩니다. 「조건 확인·승인」 화면으로 돌아가세요."};
  view.append(h("div",{class:"errpane"},
    h("h2",{}, st?`오류 ${st}`:"오류"),

    e.body?h("pre",{},JSON.stringify(e.body,null,2)):null,
    h("div",{style:"margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"},
      h("button",{class:"btn",onclick:()=>render()},"다시 시도"),
      h("button",{class:"btn",onclick:()=>{ try{localStorage.removeItem(LS_KEY);}catch(_){} location.href=location.pathname; }},"처음부터"))));

/* ==================== 이미지 뷰어 (②의 서랍·조건 목록, ③의 아코디언 공용) ====================
   **스케일 기준은 `img.naturalWidth`가 아니라 데이터의 `img_w`·`img_h`다.**
   좌표는 파싱 당시 본 이미지 기준이라, 지금 띄운 이미지가 그때 그 파일이라는 보장이 없다. */
function makeViewer({height="620px", onBoxClick}={}){
  const stage=h("div",{class:"stage"});
  const root=h("div",{class:"iv",style:"max-height:"+height});
  const warnSlot=h("div",{});
  const wrapEl=h("div",{},warnSlot,root);
  root.append(stage);
  let trace=null, img=null, warned=new Set(), markBox=null;
  const mark=h("div",{class:"ivmark",hidden:true});
  const boxes=new Map();
  function warn(key, node){ if(warned.has(key)) return; warned.add(key); warnSlot.append(node); }
  function mount(tr, url){
    trace=tr; stage.textContent=""; boxes.clear(); markBox=null; mark.hidden=true;
    img=h("img",{alt:"공고 원본 이미지"});
    img.addEventListener("load",layout);
    img.addEventListener("error",()=>{ stage.textContent="";
      stage.append(h("div",{class:"banner danger",style:"margin:14px"},
        h("b",{},"이미지 없음"),"좌표 표시 불가 — GET /image 가 이미지를 주지 않습니다. 공고 이미지는 레포에 커밋되지 않습니다.")); });
    img.src=url||""; stage.append(img);
    if (tr && tr.band && tr.band.y_top!=null){
      const bd=h("div",{class:"ivband"},h("span",{class:"lbl"},"채점 대상 구간: "+(tr.band.label||"지정 구간")));
      bd.dataset.band="1"; stage.append(bd);
    }
    for (const l of ((tr&&tr.lines)||[])){
      const conf = (l.conf==null) ? "신뢰도 없음" : ("신뢰도 "+l.conf);
      const b=h("div",{class:"ivbox "+roleKey(l), title:`${l.id} · ${ROLE_KO[roleKey(l)]} · ${conf}`});
      b.addEventListener("click",()=>onBoxClick&&onBoxClick(l));
      boxes.set(l.id,b); stage.append(b);
    }
    stage.append(mark);
    layout();
  }
  function layout(){
    if(!trace||!img||!img.clientWidth||!trace.img_w||!trace.img_h) return;
    const sx=img.clientWidth/trace.img_w, sy=img.clientHeight/trace.img_h;
    if (img.naturalWidth && img.naturalWidth!==trace.img_w){
      warn("natural", h("div",{class:"banner warn"},h("b",{},"이미지 불일치 경고"),
        ` 좌표 기준 img_w=${trace.img_w} ≠ 지금 띄운 이미지 naturalWidth=${img.naturalWidth}. `+
        `좌표는 파싱 당시 이미지 기준이므로 네모가 엉뚱한 자리에 그려질 수 있습니다. img_w 기준으로 환산했습니다.`));
    }
    for (const l of trace.lines){
      const el=boxes.get(l.id); if(!el) continue; const b=l.box;
      el.style.left=(b.x1*sx-2)+"px"; el.style.top=(b.y1*sy-2)+"px";
      el.style.width=((b.x2-b.x1)*sx+4)+"px"; el.style.height=((b.y2-b.y1)*sy+4)+"px";
    }
    if (markBox){
      const mw=markBox.img_w||trace.img_w, mh=markBox.img_h||trace.img_h;
      if (mw!==trace.img_w || mh!==trace.img_h){
        warn("markscale", h("div",{class:"banner warn"},h("b",{},"좌표 기준 불일치"),
          ` 조건 좌표 기준 ${mw}x${mh} ≠ 화면 기준 ${trace.img_w}x${trace.img_h}. 각자의 기준으로 환산했습니다.`));
      }
      const mx=img.clientWidth/mw, my=img.clientHeight/mh;
      mark.style.left=(markBox.x1*mx-3)+"px"; mark.style.top=(markBox.y1*my-3)+"px";
      mark.style.width=((markBox.x2-markBox.x1)*mx+6)+"px"; mark.style.height=((markBox.y2-markBox.y1)*my+6)+"px";
    }
    const bd=stage.querySelector("[data-band]");
    if (bd&&trace.band&&trace.band.y_top!=null){
      bd.style.top=(trace.band.y_top*sy)+"px";
      bd.style.height=(((trace.band.y_bottom!=null?trace.band.y_bottom:trace.img_h)-trace.band.y_top)*sy)+"px";
    }
  }
  new ResizeObserver(layout).observe(root);
  function setRoleVisible(offSet){ for(const l of ((trace&&trace.lines)||[])){ const el=boxes.get(l.id); if(el) el.style.display=offSet.has(roleKey(l))?"none":""; } }
  function scrollToTop(px){ root.scrollTo({top:Math.max(0,px-root.clientHeight*0.35),behavior:"smooth"}); }
  function select(lineIds, scroll=true){
    let first=null;
    boxes.forEach((el,id)=>{ const on=lineIds.includes(id); el.classList.toggle("sel",on); if(on&&!first)first=el; });
    if(first&&scroll) scrollToTop(first.offsetTop);
    return !!first;
  }
  /* 조건 하나의 bbox를 직접 그린다. **줄 목록이 없어도(=/trace 부재) 그려진다.** */
  function focusBBox(bb, scroll=true){
    if(!bb){ return; }
    markBox=bb; mark.hidden=false; layout();
    const ids=((trace&&trace.lines)||[]).filter(l=>l.box.y1>=bb.y1-6&&l.box.y2<=bb.y2+6&&l.box.x1>=bb.x1-30).map(l=>l.id);
    const hit=select(ids,scroll);
    if(!hit&&scroll&&trace&&img&&img.clientHeight) scrollToTop(bb.y1*(img.clientHeight/trace.img_h));
  }
  return {root:wrapEl, mount, select, focusBBox, setRoleVisible, layout};
}

/* ==================== 새 공고 올리기 · 이력서 넣기 (①의 곁가지) ====================

   **왜 있나.** 지금까지 새 공고를 넣는 길은 `data/postings/` 밑에 파일을 손으로 복사하는
   것뿐이었다. 그건 「돌려봤다」가 아니다. 파이프라인은 이미 이미지에서 시작하므로
   넣는 길만 뚫으면 된다.

   **이 화면이 지키는 것 하나 — 예상 시간을 먼저 말한다.** 새 이미지는 OCR이 실제로
   돈다. 실측 4920px에 376초다. 아무 표시 없이 6분을 멈춰 있으면 사람은 고장 난 줄
   안다. 그래서 (1) 올리기 **전에** 예상 시간을 말하고, (2) 도는 동안 경과 시간을 초
   단위로 보여주고, (3) 예상을 넘기면 **넘겼다고 적는다.**

   `startScore()`가 본보기다. 그쪽은 손대지 않았다 — 오늘 20:30에 고쳐 도는 코드이고,
   같이 쓰겠다고 끌어다 고치면 얻는 것 없이 그 화면이 깨질 위험만 진다. */

/* run.py의 `OCR_SECONDS_PER_PIXEL`·`OCR_SECONDS_FLOOR`를 **여기 다시 적었다.**
   서버가 이 값을 알려주는 경로가 없고(설정 엔드포인트가 없다) 이 파일은 빌드 도구 없이
   그대로 서빙된다. 어긋나면 틀리는 것은 **예상 시간 한 줄뿐**이고 화면은 그 줄을
   「추정」이라고 적는다 — 그래서 중복을 감수했다. 서버 상수를 고치면 여기도 고친다. */
const OCR_SECONDS_PER_PIXEL = 0.084;
const OCR_SECONDS_FLOOR = 60;
const OCR_SECONDS_UNKNOWN = OCR_SECONDS_FLOOR * 5;   // 세로 픽셀을 모를 때 (run.py와 같다)
const LIVE = !USE_MOCK;                              // 샘플 모드에서는 실제로 올리지 않는다

/* **확장자가 아니라 파일 앞부분으로 판정한다.** 확장자를 믿으면 `.png`로 이름만 바꾼
   아무 파일이 들어온다. 서버도 같은 검사를 하며 **판정 권한은 서버에 있다** —
   여기 검사는 6분짜리 왕복을 하기 전에 알려주는 예의일 뿐이다. */
const MAGIC=[{kind:"PNG",bytes:[0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A]},{kind:"JPEG",bytes:[0xFF,0xD8,0xFF]}];
async function sniffKind(file){
  try{
    const head=new Uint8Array(await file.slice(0,8).arrayBuffer());
    for (const m of MAGIC) if (m.bytes.every((b,i)=>head[i]===b)) return m.kind;
  }catch(e){ return null; }
  return null;
}
/* 세로 픽셀을 재는 유일한 목적은 **예상 시간**이다. 그림을 서버에 묻지 않고 브라우저가
   직접 재는 이유: 아직 올리지도 않은 파일이라 물을 곳이 없고, 사람은 **올리기 전에**
   얼마나 걸리는지 알아야 시작할지 말지를 정한다. */
function imageSize(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ res({w:im.naturalWidth,h:im.naturalHeight}); URL.revokeObjectURL(url); };
    im.onerror=()=>{ res(null); URL.revokeObjectURL(url); };
    im.src=url;
  });
}
function fmtSecs(s){ const m=Math.floor(s/60), r=Math.round(s%60); return m?`${m}분 ${r}초`:`${r}초`; }
function fmtBytes(n){ return n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB"; }
/* `_safe_id()`(api/server.py)와 **같은 규칙**이다. 서버가 최종 판정을 하고, 여기서는
   400을 받기 전에 화면에서 먼저 말해 준다. 규칙을 늘리지 않는다 — 늘리면 서버가
   받아 주는 값을 화면이 거부하게 된다. */
function badId(v){
  const s=(v||"").trim();
  if (!s) return "비어 있습니다";
  if (s==="."||s==="..") return "`.` · `..` 는 쓸 수 없습니다";
  if (s.includes("/")||s.includes("\\")) return "`/` · `\\` 는 쓸 수 없습니다";
  return null;
}
function newUpload(){
  return {screen:"posting", posting_id:"", position:"", files:[], pixelHeight:null,
    estSeconds:null, summary:null, resumes:[newResumeRow(1)], savedIds:[], preparing:false};
}
function newResumeRow(n){ return {candidate_id:"A-"+String(n).padStart(2,"0"), text:"", intended:""}; }

/* multipart는 기존 `api()`로 못 보낸다 — 그쪽은 JSON 전용이고, FormData에 직접
   Content-Type을 붙이면 경계 문자열이 빠져 서버가 못 읽는다. 브라우저가 붙이게 둔다. */
async function apiForm(path, formData){
  const r=await fetch(BASE+path,{method:"POST",body:formData});
  if (!r.ok){ let b=null; try{ b=await r.json(); }catch(e){} throw new ApiError(r.status,b); }
  return r.json();
}

/* 실패를 어디에 적을 것인가.
   `renderError()`는 화면을 통째로 갈아 끼우고 **문구가 채점 흐름 기준**이다 — 409는
   「승인이 낡았다」, 422는 「검산 위반」이라고 적혀 있다. 업로드에서 그 둘은 각각
   「식별자 중복」과 「보낸 값 문제」라서, 그대로 태우면 **화면이 거짓말을 한다.**
   그래서 이 다섯만 폼 위에 적고(입력을 잃지 않는다) 나머지는 기존 경로로 보낸다.
   404·405는 일부러 넘긴다 — 「이 서버엔 그 API가 없다」는 renderError의 문구가 맞다. */
const INLINE_STATUS=new Set([400,409,413,415,422]);
function uploadFail(slot, e, retry){
  if (!(e instanceof ApiError) || !INLINE_STATUS.has(e.status)) return renderError(e);
  const detail=e.body&&(e.body.detail!=null?e.body.detail:e.body.message);
  const KNOWN={
    400:"보낸 값이 규칙에 맞지 않습니다.",
    409:"같은 식별자의 공고가 이미 있습니다. 덮어쓰지 않습니다 — 기존 조건의 좌표는 그때 그 그림 위에서만 뜻이 있어서, 그림만 갈아 끼우면 좌표가 조용히 거짓말을 합니다. 다른 식별자를 쓰세요.",
    413:"파일이 서버 상한을 넘었습니다.",
    415:"받지 않는 형식입니다 — PNG · JPEG만 받습니다.",
    422:"보낸 값을 서버가 처리하지 못했습니다."};
  slot.textContent="";
  slot.append(h("div",{class:"banner danger"},h("b",{},"오류 "+e.status),
    (KNOWN[e.status]||"요청이 거부됐습니다.")+(detail?" — "+(typeof detail==="string"?detail:JSON.stringify(detail)):"")));
  /* **오류 본문의 `failed`를 반드시 편다.** `POST /resumes`는 하나라도 실패하면 아무것도
     저장하지 않고, detail에 「사유는 failed에 전부 담았다」고 적은 채 목록을 본문에 싣는다.
     여기서 안 펴면 화면이 있는 사유를 가리켜 놓고 안 보여주는 꼴이 된다 — 그러면 사용자는
     여섯 통 중 어느 것이 왜 막혔는지 모른 채 전부 다시 손봐야 한다. */
  const failed=(e.body&&Array.isArray(e.body.failed))?e.body.failed:[];
  if (failed.length){
    const box=h("div",{class:"diag",style:"margin:-4px 0 12px"});
    box.append(h("div",{},`막힌 통 ${failed.length}건 — 한 통도 저장되지 않았습니다. 아래를 고쳐 그대로 다시 보내면 됩니다.`));
    for (const f of failed)
      box.append(h("div",{},h("span",{class:"mono"},String((f&&(f.candidate_id||f.id))||"?")),
        " · ",String((f&&(f.reason||f.detail||f.error))||"사유 없음")));
    slot.append(box);
  }
  if (retry) slot.append(h("div",{style:"margin:-4px 0 12px"},h("button",{class:"btn",onclick:retry},"다시 시도")));
  try{ slot.scrollIntoView({behavior:"smooth",block:"nearest"}); }catch(_){}
}

/* -------------------- 업로드 1/2 — 공고 이미지 -------------------- */
function vUploadPosting(){

    h("div",{class:"hint"},"data/postings/<식별자>/ 로 저장됩니다. 이미 있는 식별자는 거부합니다 — 덮어쓰지 않습니다.")));

  /* 대상 직무 — 직무 이름을 코드에 박지 않는다. 런타임 인자다 */
  const posIn=h("input",{class:"tin",placeholder:"비워 두면 공고 전체가 대상"});
  posIn.value=U.position;
  posIn.addEventListener("input",()=>{ U.position=posIn.value; });
  card.append(h("div",{class:"field"},
    h("label",{},"채점 대상 직무 (선택)"), posIn,
    h("div",{class:"hint"},"한 공고에 직무가 여럿일 때, 그림에 적힌 직무 이름을 그대로 적습니다. 그 이름이 있는 줄부터 다음 직무 줄까지를 채점 구간으로 잡습니다. 비워 두면 공고 전체를 봅니다.")));

  /* 파일 */
  const fileIn=h("input",{type:"file",accept:"image/png,image/jpeg",multiple:"multiple",style:"display:none"});
  const drop=h("div",{class:"drop"},
    h("div",{class:"big"},"이미지를 여기 끌어다 놓거나, 눌러서 고르세요"),
    h("div",{class:"hint"},"PNG · JPEG. 여러 장이면 고른 순서대로 저장됩니다. 형식은 확장자가 아니라 파일 앞부분으로 판정합니다."));
  drop.addEventListener("click",()=>fileIn.click());
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{ e.preventDefault(); drop.classList.remove("over");
    addFiles(e.dataTransfer&&e.dataTransfer.files); });
  fileIn.addEventListener("change",()=>{ addFiles(fileIn.files); fileIn.value=""; });
  const listSlot=h("div",{});
  const estSlot=h("div",{});
  card.append(h("div",{class:"field"},h("label",{},"공고 이미지 (필수)"),drop,fileIn,listSlot,estSlot));

  const submit=h("button",{class:"btn primary"});
  const cancel=h("button",{class:"btn",onclick:()=>go(1)},"취소");
  /* 흐려진 버튼이 「무엇이 빠졌나」를 말하는 자리. `errSlot`(서버가 거절한 이유)과
     분리한다 — 하나는 **아직 못 보낸 것**이고 하나는 **보냈다 거절당한 것**이라,
     같은 자리에 쓰면 사용자가 「보내긴 했나」를 구분할 수 없다. */
  const blockSlot=h("div",{class:"hint",style:"margin:0 2px 8px;color:var(--text2)"},"");
  card.append(blockSlot,h("div",{class:"footctas"},cancel,submit));

  async function addFiles(fileList){
    const picked=Array.from(fileList||[]);
    if (!picked.length) return;
    for (const f of picked){
      const [kind,size]=await Promise.all([sniffKind(f), imageSize(f)]);
      U.files.push({file:f, kind, w:size?size.w:null, h:size?size.h:null});
    }
    refresh();
  }
  function refresh(){
    listSlot.textContent=""; estSlot.textContent="";
    U.files.forEach((rec,i)=>{
      const ok=!!rec.kind;
      listSlot.append(h("div",{class:"filerow"+(ok?"":" bad")},
        h("span",{class:"nm"},rec.file.name),
        h("span",{class:"mono"},fmtBytes(rec.file.size)),
        h("span",{class:"mono"},(rec.w&&rec.h)?`${rec.w}x${rec.h}px`:"크기 못 읽음"),
        ok?h("span",{class:"chip ok"},h("span",{class:"dot"}),rec.kind)
          :h("span",{class:"chip danger",title:"파일 앞부분이 PNG · JPEG가 아닙니다"},h("span",{class:"dot"}),"받지 않는 형식"),
        h("button",{class:"btn sm danger",onclick:()=>{ U.files.splice(i,1); refresh(); }},"빼기")));
    });
    /* 예상 시간 — **이 상자가 이 화면의 핵심이다.** */
    const heights=U.files.map(r=>r.h).filter(v=>v>0);
    U.pixelHeight = heights.length ? heights.reduce((a,b)=>a+b,0) : null;
    U.estSeconds = U.pixelHeight!=null
      ? Math.max(OCR_SECONDS_FLOOR, Math.round(U.pixelHeight*OCR_SECONDS_PER_PIXEL)) : null;
    if (U.files.length){
      const bytes=U.files.reduce((a,r)=>a+r.file.size,0);
      estSlot.append(h("div",{class:"estbox"},
        h("div",{},"글자를 읽는 데 ",
          h("span",{class:"big"}, U.estSeconds!=null?("약 "+fmtSecs(U.estSeconds)):("약 "+fmtSecs(OCR_SECONDS_UNKNOWN))),
          " 걸립니다"),
        h("div",{class:"hint",style:"color:var(--text2)"},
          U.pixelHeight!=null
            ? `세로 ${U.pixelHeight.toLocaleString()}px × ${OCR_SECONDS_PER_PIXEL}초/px. 실측 둘(4920px→376초 · 2533px→232초)로 잡은 눈금이라 정확한 예측이 아닙니다 — 자리를 뜨지 않고 기다릴지 판단하라고 적는 값입니다.`
            : `이미지 크기를 읽지 못해 기본값으로 잡았습니다.`),
        h("div",{class:"hint",style:"color:var(--text2)"},
          /* 상한값을 화면에 박지 않는다 — 서버 상수와 어긋나면 화면이 받아 주는 것을
             서버가 거부하거나 그 반대가 된다. 「누가 검사하는가」만 말한다. */
          `파일 ${U.files.length}개 · 합계 ${fmtBytes(bytes)}. 장 수 · 장당 · 합계 상한은 서버가 검사합니다.`),
        h("div",{class:"hint",style:"color:var(--text2)"},
          "읽는 일은 서버에서 돕니다. 도는 동안 경과 시간을 화면에 보여 줍니다.")));
    }
    const idErr=badId(U.posting_id);
    const badFile=U.files.some(r=>!r.kind);
    submit.disabled = !LIVE ? false : (!!idErr || !U.files.length || badFile);
    submit.textContent = LIVE ? "올리고 이력서 넣기 →" : "샘플 모드 — 저장하지 않고 다음 화면 보기 →";

    /* **흐려진 버튼은 이유를 말해야 한다.**
       `.btn:disabled`가 opacity를 낮추긴 하지만, 그건 「못 누른다」만 말하고
       「무엇이 빠졌나」는 말하지 않는다. 처음 온 사람은 칸 둘과 상자 하나를 번갈아
       보며 무엇이 모자란지 스스로 찾아내야 한다.
       빠진 것을 **전부** 적는다 — 하나씩 알려 주면 고치고 다시 막히기를 반복한다. */
    const missing=[];
    if (LIVE){
      if (!U.posting_id.trim()) missing.push("공고 식별자");
      else if (idErr) missing.push("쓸 수 있는 공고 식별자");
      if (!U.files.length) missing.push("공고 이미지");
      else if (badFile) missing.push("PNG · JPEG 형식의 이미지 — 받지 않는 형식이 섞여 있습니다");
    }
    blockSlot.textContent = missing.length
      ? ("아직 못 누릅니다 — 필요한 것: " + missing.join(" · ")) : "";
    submit.title = blockSlot.textContent;
  }
  idIn.addEventListener("input",()=>{
    U.posting_id=idIn.value;
    const err=badId(U.posting_id);
    idHint.textContent = err ? ("공고 식별자로 쓸 수 없습니다 — "+err) : "";
    idHint.style.color = err ? "var(--danger)" : "";
    refresh();
  });
  submit.addEventListener("click",async()=>{
    errSlot.textContent="";
    if (!LIVE){ U.screen="resumes"; return render(); }   /* 샘플 모드는 아무것도 저장하지 않는다 */
    const pid=U.posting_id.trim();
    submit.disabled=true; submit.textContent="올리는 중… (POST /postings)";
    const fd=new FormData();
    fd.append("posting_id", pid);
    if (U.position.trim()) fd.append("position", U.position.trim());
    for (const rec of U.files) fd.append("files", rec.file, rec.file.name);
    try{
      U.summary=await apiForm("/postings", fd);
      U.posting_id=pid;
      S.postings=null;            /* 목록을 다시 받게 한다 — 방금 만든 공고가 들어 있어야 한다 */
      U.screen="resumes"; render();
    }catch(e){ refresh(); uploadFail(errSlot, e, null); }
  });
  refresh();
}

/* 빈 칸 앞에서 「무엇을 어떤 형태로 넣나」를 모르는 것이 이 화면의 가장 큰 벽이다.
   그래서 안내를 둔다. **안내일 뿐이고 검사하지 않는다** — 엔진은 이력서를 `text` 하나에
   담긴 통짜 글로 읽고 섹션을 파싱하지 않는다. 심사위원이 본문을 읽어 문자 오프셋으로
   인용할 뿐이다. 여기서 양식을 강제하면 다른 서식의 이력서가 거부되어 직군 무관
   일반화가 깨진다 — 목업 12명조차 섹션 이름이 서로 다르다.

   그래서 예시를 **둘** 놓는다. 하나만 놓으면 「이 형식이어야 한다」로 읽힌다. */
const RESUME_SECTIONS=["인적사항","학력","경력","보유 기술","경험 · 활동 · 교육",
  "자격 · 어학 · 수상","포트폴리오 · 기타문서","경력기술서","자기소개서","취업 우대사항 (병역 · 보훈 등)"];
const RESUME_SHAPES=[
  "인적사항 · 학력사항 · 경력 및 대외활동 · 자격 및 어학 · 자기소개서",
  "기본 정보 · 학력 · 보유 기술 · 프로젝트 · 협업 경험 · 자기소개",
];
function resumeHelp(){
  const box=h("details",{class:"drawer"});
  box.append(h("summary",{},h("span",{class:"tri"},"▸"),"어떤 형태로 넣나",
    h("span",{class:"hint",style:"margin:0"},"(양식은 검사하지 않습니다 — 그대로 붙여넣으면 됩니다)")));
  const body=h("div",{class:"drawerbody"});
  body.append(h("div",{class:"kv"},
    "이 엔진은 이력서를 ",h("b",{},"글 한 덩어리"),"로 읽습니다. 칸을 나눠 읽지 않고, 심사위원이 본문을 읽어 원문 그대로 인용합니다. 그래서 ",
    h("b",{},"어떤 양식이든 그대로 붙여넣으면 됩니다."),
    " 아래는 강제가 아니라 흔히 쓰는 칸입니다 — 없는 칸이 있어도, 이름이 달라도 그대로 받습니다."));
  const chips=h("div",{class:"legend",style:"margin:10px 0 0"});
  for (const s of RESUME_SECTIONS) chips.append(h("span",{class:"chip neutral"},h("span",{class:"dot"}),s));
  body.append(chips);
  body.append(h("div",{class:"sect"},"실제로 이렇게들 씁니다 — 둘 다 그대로 채점됩니다"));
  for (const shape of RESUME_SHAPES)

}

/* -------------------- 업로드 2/2 — 이력서 -------------------- */
function vUploadResumes(){
  const U=S.up;
  const pid=U.posting_id.trim();
  const errSlot=h("div",{});
  const runSlot=h("div",{});
  const card=h("div",{class:"card",style:"max-width:860px"});
  view.append(card, runSlot);
  card.append(
    h("div",{style:"display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:6px"},
      h("h2",{style:"margin:0"},"이력서 넣기"), h("span",{class:"hsub"},"2 / 2 · 공고 "),
      h("span",{class:"mono",style:"font-size:12px"},pid||"(식별자 없음)")),
    h("p",{class:"desc"},"이력서는 글로 붙여넣습니다. 여러 명을 한 번에 올립니다 — 한 명씩 여러 번 올리지 않습니다."),
    h("div",{class:"banner info"},h("b",{},"가리는 시점"),
      "저장은 원문 그대로 합니다. 이름·나이·성별·출신지·학교명 같은 항목은 채점 직전에 가립니다 — 저장할 때 미리 가리면 두 번 가려져 인용 위치가 어긋나고, 그러면 근거 사슬이 거짓말을 합니다."),
    resumeHelp(),
    errSlot);
  if (!LIVE) card.append(h("div",{class:"banner warn"},h("b",{},"샘플 모드"),
    "화면만 볼 수 있습니다. 저장도 글자 읽기도 실서버에서만 됩니다."));

  const list=h("div",{});
  card.append(list);
  function drawRows(){
    list.textContent="";
    U.resumes.forEach((row,i)=>{
      const idIn=h("input",{class:"tin mono",placeholder:"지원자 식별자"}); idIn.value=row.candidate_id;
      idIn.addEventListener("input",()=>{ row.candidate_id=idIn.value; });

        h("option",{value:"perfect"},"완벽 매칭으로 설계"),
        h("option",{value:"partial"},"부분 매칭으로 설계"),
        h("option",{value:"mismatch"},"미스매칭으로 설계"));
      sel.value=row.intended||"";
      sel.addEventListener("change",()=>{ row.intended=sel.value; });
      /* placeholder에도 예시를 적는다 — 서랍을 안 펴는 사람이 대부분이고, 빈 칸은
         「무엇을 넣으라는 건지」를 스스로 말하지 못한다. 예시는 한 줄로 줄인다. */
      const ta=h("textarea",{class:"tin",
        placeholder:"이력서 전문을 그대로 붙여넣으세요 — 양식은 검사하지 않습니다.\n"+
          "예) 인적사항 · 학력 · 경력 · 보유 기술 · 자격/어학 · 자기소개서 …\n"+
          "칸 이름이 다르거나 일부가 없어도 그대로 받습니다."});
      ta.value=row.text;
      const cnt=h("span",{class:"hint"},"");
      const upd=()=>{ cnt.textContent=`${ta.value.length.toLocaleString()}자`; };
      ta.addEventListener("input",()=>{ row.text=ta.value; upd(); });
      upd();
      list.append(h("div",{class:"rescard"},
        h("div",{class:"top"},
          h("span",{class:"chip neutral"},h("span",{class:"dot"}),String(i+1)),
          h("span",{class:"grow"},idIn), h("span",{class:"grow"},sel),
          h("button",{class:"btn sm danger",onclick:()=>{
            U.resumes.splice(i,1);
            if (!U.resumes.length) U.resumes.push(newResumeRow(1));
            drawRows(); }},"빼기")),
        ta, h("div",{style:"margin-top:4px"},cnt)));
    });
  }
  drawRows();
  card.append(h("div",{style:"margin:2px 0 4px"},
    h("button",{class:"btn",onclick:()=>{ U.resumes.push(newResumeRow(U.resumes.length+1)); drawRows(); }},
      "+ 지원자 추가")));

  const save=h("button",{class:"btn primary"});
  const skip=h("button",{class:"btn",title:"채점은 못 하지만 공고에서 어떤 조건이 나왔는지는 볼 수 있습니다"},
    "이력서 없이 조건만 만들기");
  card.append(h("div",{class:"footctas"},
    h("button",{class:"btn",onclick:()=>{ U.screen="posting"; render(); }},"← 공고 이미지로"),
    skip, save));
  const label=()=>{
    const n=U.resumes.filter(r=>r.text.trim()).length;
    return LIVE ? (n?`이력서 ${n}명 저장하고 조건 만들기 →`:"이력서를 붙여넣으세요")
                : "샘플 모드 — 저장·읽기는 실서버에서만";
  };
  const syncSave=()=>{ save.textContent=label(); save.disabled=!LIVE||!U.resumes.some(r=>r.text.trim()); };
  list.addEventListener("input",syncSave);   /* 이벤트가 올라온다 — 칸마다 붙이지 않는다 */
  syncSave();
  skip.disabled=!LIVE;

  /* 읽기가 시작되면 두 버튼을 다 잠근다. `startPrepare()`가 중복 호출을 막긴 하지만,
     눌리는 것처럼 보이는 버튼은 「눌렀는데 아무 일도 안 일어난다」로 읽힌다. */
  const lock=(msg)=>{ save.disabled=true; skip.disabled=true; save.textContent=msg; };
  skip.addEventListener("click",()=>{ errSlot.textContent=""; lock("이력서 없이 공고만 읽는 중"); startPrepare(runSlot); });
  save.addEventListener("click",async()=>{
    errSlot.textContent="";
    const rows=U.resumes.filter(r=>r.text.trim()||r.candidate_id.trim());
    const bad=[];
    const seen=new Set();
    if (!rows.length) bad.push("이력서가 한 통도 없습니다");
    for (const r of rows){
      const id=r.candidate_id.trim();
      const err=badId(id);
      if (err) bad.push(`${id||"(빈 칸)"} — 지원자 식별자로 쓸 수 없습니다 (${err})`);
      else if (seen.has(id)) bad.push(`${id} — 같은 식별자가 두 번 있습니다`);
      else seen.add(id);
      if (!r.text.trim()) bad.push(`${id||"(빈 칸)"} — 본문이 비었습니다`);
    }
    if (bad.length){
      errSlot.append(h("div",{class:"banner danger"},h("b",{},"보내기 전 확인"),bad.join(" · ")));
      return;
    }
    save.disabled=true; save.textContent="저장하는 중… (POST /resumes)";
    const payload={posting_id:pid, resumes:rows.map(r=>{
      const o={candidate_id:r.candidate_id.trim(), text:r.text};
      if (r.intended) o.intended_type=r.intended;
      return o;
    })};
    try{
      const res=await api("/resumes",{body:payload});
      /* **응답 필드 이름이 계약에 없다.** 「저장된 id 목록 + 실패 목록」이라고만 적혀
         있어서 서버가 무엇을 쓸지 모른다. 몇 가지를 받아 보고, 못 알아보면 응답을
         그대로 화면에 적는다 — 조용히 성공으로 넘기지 않는다. */
      const saved=pickList(res,["saved","saved_ids","stored","candidate_ids","resumes"]);
      const failed=pickList(res,["failed","failures","errors","rejected"]);
      U.savedIds=saved.map(x=>typeof x==="string"?x:(x&&(x.candidate_id||x.id))||"?");
      if (failed.length){
        save.disabled=false; save.textContent=label();
        errSlot.append(h("div",{class:"banner danger"},h("b",{},`저장 실패 ${failed.length}건`),
          failed.map(f=>typeof f==="string"?f:`${(f&&(f.candidate_id||f.id))||"?"} — ${(f&&(f.reason||f.detail||f.error))||"사유 없음"}`).join(" · ")));
        if (U.savedIds.length)
          errSlot.append(h("div",{class:"banner info"},h("b",{},`저장됨 ${U.savedIds.length}건`),U.savedIds.join(", ")));
        return;
      }
      if (!saved.length)
        errSlot.append(h("div",{class:"banner warn"},h("b",{},"응답을 못 알아봤습니다"),
          "서버가 2xx를 줬지만 저장 목록의 모양을 모릅니다: "+JSON.stringify(res).slice(0,300)));
      else
        errSlot.append(h("div",{class:"banner info"},h("b",{},`저장됨 ${U.savedIds.length}건`),U.savedIds.join(", ")));
      lock(`이력서 ${U.savedIds.length||rows.length}명 저장됨 — 공고를 읽는 중`);
      startPrepare(runSlot);
    }catch(e){
      save.disabled=false; save.textContent=label();
      uploadFail(errSlot, e, null);
    }
  });
}
function pickList(obj, keys){
  for (const k of keys){ const v=obj&&obj[k]; if (Array.isArray(v)) return v; }
  return [];
}

/* -------------------- 공고 읽기 진행 표시 (POST /prepare) --------------------

   `startScore()`와 같은 원칙이다. 서버가 진행률을 안 주므로 **아는 척하지 않는다.**
   다른 점 하나 — 여기는 예상 시간을 **픽셀에서 계산**할 수 있다. 그래서 남은 시간을
   말할 수 있고, 예상을 넘기면 **넘겼다고 적는다.** 마지막 칸에 도착해 놓고 입을 다물면
   사람은 「멈췄다」로 읽는다. 오늘 채점 화면에서 실제로 그렇게 읽혔다. */
let prepTimer=null;
function startPrepare(slot){
  const U=S.up;
  if (!U || U.preparing) return;
  U.preparing=true;
  const pid=U.posting_id.trim();
  const known=U.estSeconds!=null;
  const ocrSecs=known?U.estSeconds:OCR_SECONDS_UNKNOWN;
  /* OCR 뒤 네 단계는 **어림이다.** 코드 계산 둘과 글자만 보내는 LLM 호출 둘이라
     합쳐서 십수 초인데, 이 넷은 실측한 적이 없다. 화면에도 그렇게 적는다. */
  const stages=[
    {name:"이미지에서 글자·좌표 읽기 (OCR)", secs:ocrSecs},
    {name:"줄을 섹션·항목으로 나누기 (코드)", secs:0.5},
    {name:"섹션 제목 역할 분류 (LLM 1회 · 글자만 보냄)", secs:6},
    {name:"조건 갈래 분류 (LLM 1회 · 글자만 보냄)", secs:8},
    {name:"조건에서 루브릭 초안 만들기 (코드)", secs:0.5},
  ];
  const total=stages.reduce((a,s)=>a+s.secs,0);
  slot.textContent="";
  const card=h("div",{class:"card",style:"margin-top:14px;max-width:660px"},
    h("h2",{},"공고를 읽는 중"),
    h("div",{class:"kv",style:"margin:2px 2px 0"},
      "서버는 진행률을 보내지 않는다 — 아래 단계는 ",h("b",{},"경과 시간으로 찍은 추정"),
      "이다. 확실한 값은 경과 시간뿐."));
  const ul=h("ul",{class:"stages"});
  stages.forEach((s,i)=>ul.append(h("li",{"data-i":i,
    title:i===0?"시간의 대부분이 여기다. 세로 픽셀에 비례한다":"코드 계산과 글자만 보내는 LLM 호출이다. 이 넷의 시간은 실측이 아니라 어림이다"},
    h("span",{class:"ic"},""), s.name)));
  const foot=h("div",{class:"kv",style:"margin:12px 2px 0"});
  card.append(ul, foot,
    h("div",{class:"hint",style:"margin-top:10px"},
      known ? `예상 ${fmtSecs(ocrSecs)} — 세로 ${U.pixelHeight.toLocaleString()}px × ${OCR_SECONDS_PER_PIXEL}초/px로 찍었다. 빗나갈 수 있다.`
            : `세로 픽셀을 몰라 기본값 ${fmtSecs(ocrSecs)}으로 잡았다.`),
    h("div",{class:"hint"},"이미 읽어 둔 공고면 저장된 결과를 써서 훨씬 빨리 끝난다. 끝나면 「조건 확인·승인」 화면으로 넘어간다."),
    h("div",{class:"hint"},"창을 닫으면 결과 화면을 못 받는다. 서버가 읽어 둔 것은 남으므로 다시 시도하면 처음보다 빠르다."));
  slot.append(card);
  card.scrollIntoView({behavior:"smooth",block:"nearest"});

  const t0=Date.now();
  let finished=false;
  const tick=()=>{
    const el=(Date.now()-t0)/1000;
    let cur=stages.length, acc=0;
    if (!finished) for (let j=0;j<stages.length;j++){
      if (el < acc+stages[j].secs){ cur=j; break; }
      acc+=stages[j].secs;
    }
    ul.querySelectorAll("li").forEach((li,j)=>{
      li.className=j<cur?"done":(j===cur?"doing":"");
      li.querySelector(".ic").textContent=j<cur?"✓":"";
    });
    const mm=Math.floor(el/60), ss=String(Math.floor(el%60)).padStart(2,"0");
    if (finished){ foot.textContent=`완료 · ${mm}분 ${ss}초 걸렸다 (예상 ${fmtSecs(total)})`; return; }
    foot.textContent = el>total
      ? `${mm}분 ${ss}초 경과 · 예상 ${fmtSecs(total)}를 넘겼다 — 서버는 아직 응답하지 않았다. 예상은 픽셀 수로 찍은 값이라 빗나간다.`
      : `${mm}분 ${ss}초 경과 · 남은 예상 ${fmtSecs(Math.max(0,total-el))} (전체 ${fmtSecs(total)})`;
  };
  tick();
  clearInterval(prepTimer);
  prepTimer=setInterval(tick,1000);
  const settle=()=>{ finished=true; tick(); clearInterval(prepTimer); U.preparing=false; };

  const options=U.position.trim()?{position:U.position.trim()}:{};
  api("/prepare",{body:{posting_id:pid, options}})
    .then(async prop=>{
      settle();
      S.proposal=prop;
      const raw=await apiOptional("/trace/"+encodeURIComponent(pid));
      S.trace=normalizeTrace(raw,prop.graph)||traceFromGraph(prop.graph); S.traceMiss=LAST_OPTIONAL_MISS;
      S.imgUrl=imageUrl(pid);
      S.run=null; S.openCands=new Set(); S.resumes={}; S.postings=null;
      /* 응답이 `PostingSummary`면 그대로 쓰고, 아니면 우리가 아는 값으로 최소한만 채운다.
         **`source_kind`를 화면이 지어내지 않는다** — 모르면 서버가 준 값이 없다는 뜻이고,
         그때는 `/postings`를 다시 받아 채워진다. */
      S.posting=(U.summary&&U.summary.posting_id)?U.summary
        :{posting_id:pid, source_kind:"local", target_position:(U.position.trim()||null),
          image_count:U.files.length, api_verified:false};
      S.visited=new Set([1,2]);
      go(2);
    })
    .catch(e=>{ settle(); uploadFail(slot, e, ()=>startPrepare(slot)); });
}

/* ==================== ② 조건 확인·승인 ====================
   **이 화면이 파이프라인이 실제로 멈추는 자리다.** 파싱 확인은 여기 접힌 서랍으로
   들어갔고(구경거리는 단계가 아니다), 채점 진행도 화면이 아니라 이 화면의 진행 표시다. */

/* 서랍 머리말 — 「▸ 자세히」로는 아무도 안 연다. 안에 뭐가 있는지 숫자로 예고한다 */
function drawerHint(){
  const R=parseReportOf(), T=S.trace;
  const bits=[];
  if (T&&T.lines&&T.lines.length) bits.push(`읽은 줄 ${T.lines.length}`);
  if (R&&R.line_count!=null) bits.push(`채점 대상 ${R.line_count}줄`);
  if (R&&R.role_counts&&R.role_counts.ambiguous!=null) bits.push(`모호 ${R.role_counts.ambiguous}`);
  if (T&&T.avg_conf!=null) bits.push(`평균 신뢰도 ${T.avg_conf}`);
  if (R&&R.llm_calls!=null) bits.push(`LLM ${R.llm_calls}회`);
  if (R&&R.excluded_blocks) bits.push(`제외 블록 ${R.excluded_blocks.length}`);
  return bits.length?bits.join(" · "):"응답에 파싱 진단이 없습니다";
}
/* 서랍 본문 — 옛 「② 파싱 확인」 화면이 통째로 여기 들어온다. 지운 것 없다. */
function parseDrawerBody(vw){
  const T=S.trace, R=parseReportOf();
  const body=h("div",{class:"drawerbody"});
  body.append(inspectLine());
  if (!T){
    body.append(h("div",{class:"banner danger"},h("b",{},"표시할 좌표 없음"),"파싱 결과에 좌표가 없습니다."));
    return body;
  }
  if (T.degraded){
    const miss=S.traceMiss;
    body.append(h("div",{class:"banner warn"},h("b",{},"줄 단위 대조 불가"),
      "GET /trace 응답을 받지 못해 OCR 줄 목록이 없습니다. 지금 보이는 네모는 조건의 source_bbox 뿐이며, 신뢰도·판정·LLM에 보낸 문자열은 표시할 수 없습니다."+
      (miss?` (${miss.status}${miss.detail?" — "+miss.detail:""})`:"")+
      (miss&&miss.status===409?" 공고 고르기에서 「조건 확인하기」를 먼저 눌러 주세요.":"")));
  } else if (typeof T.cached==="boolean"){
    body.append(h("div",{style:"margin-bottom:10px"},h("span",{class:"chip neutral",
      title:T.cached?"파일에 저장돼 있던 파싱 결과를 그대로 읽었다 (LLM 호출 0회)":"이 요청에서 파싱 결과를 새로 만들었다 (LLM 호출 0회)"},
      h("span",{class:"dot"}), T.cached?"저장된 파싱 결과":"방금 계산함")));
  }
  /* 판정 범례 + 토글 */
  const legend=h("div",{class:"legend"});
  for (const k of [...new Set(T.lines.map(roleKey))]){
    const chip=h("button",{class:"lg"+(S.roleOff.has(k)?" off":""),title:"누르면 이 판정의 네모를 숨기거나 다시 보입니다"},
      h("span",{class:"sw",style:`border-color:${ROLE_COLOR[k]};background:color-mix(in srgb,${ROLE_COLOR[k]} 22%,transparent);${k==="continuation"?"border-style:dashed;":""}`}),
      ROLE_KO[k]||k);
    chip.addEventListener("click",()=>{ S.roleOff.has(k)?S.roleOff.delete(k):S.roleOff.add(k); chip.classList.toggle("off"); vw.setRoleVisible(S.roleOff); });
    legend.append(chip);
  }
  body.append(legend);
  const listEl=h("div",{class:"linelist",style:"max-height:420px"});
  body.append(listEl);
  listEl.append(h("div",{class:"ll llh"},h("span",{},"줄 id"),h("span",{},"y"),h("span",{},"x0"),h("span",{},"신뢰도"),h("span",{},"판정"),h("span",{},"읽은 글자")));
  const rowEls=new Map();
  for (const l of T.lines){
    const rk=roleKey(l);
    const row=h("div",{class:"ll"},
      h("span",{class:"mono"},l.id),
      h("span",{class:"mono"},String(l.box.y1)),
      h("span",{class:"mono"},l.x0==null?"—":String(l.x0)),
      l.conf==null ? h("span",{class:"mono miss"},"없음")
        : h("span",{class:"mono",style:l.conf<0.85?"color:var(--warning);font-weight:700":""},l.conf.toFixed(3)),
      h("span",{class:"role",style:"color:"+ROLE_COLOR[rk]},ROLE_KO[rk]||rk),
      h("span",{class:"txt"},l.text));
    row.addEventListener("click",()=>pick(l.id,"fromList"));
    rowEls.set(l.id,row); listEl.append(row);
  }
  function pick(id,src){
    S.focusLine=id;
    rowEls.forEach((el,k)=>el.classList.toggle("sel",k===id));
    vw.select([id], src!=="fromImg");
    if(src!=="fromList"){ const el=rowEls.get(id); if(el) listEl.scrollTo({top:Math.max(0,el.offsetTop-listEl.clientHeight*0.4),behavior:"smooth"}); }
  }
  S.pickLine=pick;
  if (S.focusLine && rowEls.has(S.focusLine)) pick(S.focusLine,"restore");
  /* 파싱 진단 */
  const diag=h("div",{class:"diag"});
  if (!R){ diag.append("파싱 진단 없음 — 응답에 parse_report가 없습니다"); }
  else{
    const rc=R.role_counts||{};
    const amb=(rc.ambiguous!=null&&R.line_count)?rc.ambiguous/R.line_count:null;
    diag.append(`파싱 경로 ${R.parse_mode||"없음"} · OCR 엔진 ${R.ocr_engine||"없음"} · 줄 ${R.line_count!=null?R.line_count:"없음"}개 · `);
    diag.append(T.avg_conf==null? h("span",{class:"miss"},"평균 신뢰도 없음") : `평균 신뢰도 ${T.avg_conf}`);
    diag.append(" · ");
    diag.append(amb==null ? h("span",{class:"miss"},"모호 비율 없음")
      : h("span",{class:amb>0.5?"bad":""},`모호 비율 ${(amb*100).toFixed(1)}%${amb>0.5?" ⚠ 50% 초과":""}`));
    diag.append(` · LLM 호출 ${R.llm_calls!=null?R.llm_calls:"없음"}회 · 이어붙인 줄 ${R.merged_continuations!=null?R.merged_continuations:"없음"}개`);
    diag.append(h("div",{},`판정 내역: `+(Object.keys(rc).length?Object.entries(rc).map(([k,v])=>`${ROLE_KO[k]||k} ${v}`).join(" · "):"없음")));
    diag.append(h("div",{},`제외 블록: ${(R.excluded_blocks&&R.excluded_blocks.length)?R.excluded_blocks.join(", "):"없음"}`));
    if (R.emphasis_available===false)
      diag.append(h("div",{},"시각 강조 신호: 입력 없음 — 판정 사다리 5단계(시각 강조)는 이 경로에서 발동하지 않습니다"));
  }
  body.append(diag);
  /* LLM에 보낸 것 */
  body.append(h("div",{class:"sect",title:"이 시스템은 공고 이미지를 LLM에 보내지 않는다. 아래 문자열이 LLM이 본 전부다"},"LLM에 보낸 문자열 · 돌아온 판정"));
  const roles=T.header_roles||null;
  const sent=(T.sent_to_llm&&T.sent_to_llm.headers)||(roles?Object.keys(roles):null);
  if (!sent||!sent.length){
    body.append(h("div",{class:"kv"},"응답에 sent_to_llm · header_roles 없음"));
  } else {
    const KO={requirement:"지원자격(필수 후보)",preferred:"우대 조건",duty:"담당업무(조건 아님)",context:"맥락(조건 아님)",excluded:"채점 제외"};
    body.append(h("div",{class:"tscroll",style:"max-height:300px;overflow:auto"},h("table",{class:"t"},
      h("tr",{},h("th",{},"보낸 문자열"),h("th",{},"돌아온 판정"),h("th",{},"뜻")),
      ...sent.map(hd=>{ const role=(roles&&roles[hd])||null;
        return h("tr",{},h("td",{class:"mono"},hd),h("td",{class:"mono"},role||"—"),h("td",{},role?(KO[role]||role):"응답 없음")); }))));
    const ambSent=(T.sent_to_llm&&T.sent_to_llm.ambiguous)||[];
    if (ambSent.length)
      body.append(h("div",{class:"kv",style:"margin-top:10px"},h("b",{},"함께 보낸 모호 줄: "),

  }
  /* 섹션별 채점 여부 — `scored`는 「조건 섹션인가」이고, role==="duty"인 섹션도
     rubric/build.py가 judgment 층 루브릭 항목을 만든다. 세 갈래로 나눈다. */
  if (T.blocks && T.blocks.length){
    const kindOf=b=>b.scored?"cond":(b.role==="duty"?"duty":"out");
    const g={cond:[],duty:[],out:[]};
    for (const b of T.blocks) g[kindOf(b)].push(b);
    body.append(h("div",{class:"sect"},
      `섹션 ${T.blocks.length} · 조건 ${g.cond.length} · 담당업무 ${g.duty.length} · 제외 ${g.out.length}`));
    const CHIP={cond:["ok","조건 섹션"],duty:["info","담당업무"],out:["neutral","채점 제외"]};
    const draw=(b,k)=>{
      const box=h("div",{class:"crit",style:(k==="out"?"opacity:.42;background:var(--sunken);border-style:dashed":"")},
        h("div",{class:"head"},
          h("span",{class:"chip "+CHIP[k][0]},h("span",{class:"dot"}),CHIP[k][1]),
          h("div",{class:"rtext",style:"cursor:default"},b.header||"(제목 없는 블록)"),
          h("span",{class:"mono",style:"font-size:11px;color:var(--text3)"},b.role||"판정 없음")));
      if (b.items&&b.items.length)
        box.append(h("div",{class:"kv",style:"margin-top:6px;white-space:pre-wrap;word-break:break-all"},
          b.items.map(t=>"· "+String(t).replace(/\n/g," ")).join("\n")));
      return box;
    };
    for (const b of g.cond) body.append(draw(b,"cond"));
    if (g.duty.length){
      body.append(h("div",{class:"sect",title:"지원자의 자격은 아니지만 판단 층 루브릭 항목이 만들어진다 — 「채점 제외」가 아니다"},
        `담당업무 ${g.duty.length}`));
      for (const b of g.duty) body.append(draw(b,"duty"));
    }
    if (g.out.length){
      const sub=h("details",{class:"drawer",style:"margin-top:10px"});
      sub.append(h("summary",{},h("span",{class:"tri"},"▸"),`채점 제외 섹션 ${g.out.length}`));
      const sb=h("div",{class:"drawerbody"});
      for (const b of g.out) sb.append(draw(b,"out"));
      sub.append(sb); body.append(sub);
    }
  }
  return body;
}

/* 채점 진행 — **서버는 진행률을 보내지 않는다.**
   `POST /score` 는 요청 하나로 끝까지 돌고 결과를 한 번에 돌려준다. 중간 상태를 흘리는
   경로가 없다. 그래서 이 화면이 할 수 있는 정직한 일은 **아는 것만 보여주는 것**이다.

   ## 왜 고쳤나 (2026-09-01 20:30)

   옛 코드는 `setInterval(…, 1400)`으로 1.4초마다 칸을 넘겼다. 5.6초면 마지막 칸
   「집계·랭킹」에 도착하고 거기서 9분을 멈춰 있었다. 사용자가 **「거의 다 됐는데
   멈췄다」**고 읽었고, 실제로는 **막 시작한 참**이었다.

   틀린 건 타이머 값이 아니라 **칸마다 같은 시간을 준 것**이다. 실측하면 시간의 99%가
   판단 채점 하나에 있다 — 나머지 넷을 합쳐도 1초가 안 된다.

   ## 실측 (kt-b2c-20260901-202146)

   채점 항목 11개 × 지원자 6명 × 심사위원 2명 = 132회, 이견 조정 3회가 붙어 **135회 ·
   약 9분**. 그래서 `secs`는 균등이 아니라 이 비율이다.

   추정을 지우지는 않았다 — 지우면 화면이 9분간 아무 말도 안 한다. 대신 **추정이라고
   적고**, 정확히 아는 값(경과 시간)을 같이 낸다. */
const STAGES=[
  {name:"게이트",    secs:0.2},
  {name:"사실 채점", secs:0.2},
  {name:"판단 채점", secs:540},   /* ← 여기가 사실상 전부다 */
  {name:"검산",      secs:0.1},
  {name:"집계·랭킹", secs:0.1},
];
const STAGE_HINT="판단 채점만 LLM을 부른다. 나머지 넷은 코드 계산이라 합쳐서 1초가 안 걸린다.";
let stageTimer=null;
function startScore(slot){
  if (S.scoring && slot.childElementCount) return;
  S.scoring=true;
  slot.textContent="";
  const n=(S.proposal&&S.proposal.criteria||[]).length;
  const card=h("div",{class:"card",style:"margin-top:14px;max-width:620px"},
    h("h2",{},"채점 진행 중"),
    h("div",{class:"kv",style:"margin:2px 2px 0"},
      "서버는 진행률을 보내지 않는다 — 아래 단계는 ",
      h("b",{},"경과 시간으로 찍은 추정"),
      "이다. 확실한 값은 경과 시간뿐."));
  const ul=h("ul",{class:"stages"});
  STAGES.forEach((s,i)=>ul.append(h("li",{"data-i":i,title:i===2?STAGE_HINT:""},h("span",{class:"ic"},""),s.name)));
  const foot=h("div",{class:"kv",style:"margin:12px 2px 0"});
  card.append(ul,foot);
  slot.append(card);
  card.scrollIntoView({behavior:"smooth",block:"nearest"});

  const t0=Date.now();
  let finished=false;
  const tick=()=>{
    const el=(Date.now()-t0)/1000;
    /* 경과 시간이 어느 구간에 들어가는가. 끝나면 전부 ✓ */
    let cur=STAGES.length, acc=0;
    if (!finished) for (let j=0;j<STAGES.length;j++){
      if (el < acc+STAGES[j].secs){ cur=j; break; }
      acc+=STAGES[j].secs;
    }
    ul.querySelectorAll("li").forEach((li,j)=>{
      li.className=j<cur?"done":(j===cur?"doing":"");
      li.querySelector(".ic").textContent=j<cur?"✓":"";
    });
    const mm=Math.floor(el/60), ss=String(Math.floor(el%60)).padStart(2,"0");
    foot.textContent = finished
      ? `완료 · ${mm}분 ${ss}초 걸렸다`
      : `${mm}분 ${ss}초 경과 · 심사위원 호출 ${n?`항목 ${n}개 × 지원자 × 2명`:"다수"} · 실측 기준 8~10분`;
  };
  tick();
  clearInterval(stageTimer);
  stageTimer=setInterval(tick,1000);
  const settle=()=>{ finished=true; tick(); clearInterval(stageTimer); };
  /* resume_ids를 보내지 않는다 — 그 공고 디렉터리의 이력서 전원이 대상이다.
     화면이 목록을 박아 두면 공고마다 다른 지원자 id에서 조용히 어긋난다. */
  api("/score",{body:{posting_id:S.proposal.posting_id, options:{}}})
    .then(run=>{
      settle(); S.scoring=false; S.run=run; S.openCands=new Set(); S.resumes={};
      try{ localStorage.setItem(LS_KEY,JSON.stringify({posting_id:run.posting_id,run_id:run.run_id})); }catch(e){}
      go(3);
    })
    .catch(e=>{ settle(); S.scoring=false; renderError(e); });
}

function axisSums(c){
  const out={fact:0,judgment:0,gate:0}, max={fact:0,judgment:0,gate:0};
  for (const a of (c.breakdown||[])){
    if (out[a.layer]==null) continue;
    out[a.layer]+=a.weighted; max[a.layer]+=a.max_weighted;
  }
  return {f:+out.fact.toFixed(1), j:+out.judgment.toFixed(1), fm:+max.fact.toFixed(1), jm:+max.judgment.toFixed(1)};
}

      const open=acc.hidden;
      acc.hidden=!open; head.classList.toggle("open",open);
      if (open){
        S.openCands.add(c.candidate_id);
        if (!acc.childElementCount) acc.append(candidateDetail(c));
      } else S.openCands.delete(c.candidate_id);
    });
    wrap.append(head,acc);
    if (S.openCands.has(c.candidate_id)){ acc.hidden=false; head.classList.add("open"); acc.append(candidateDetail(c)); }
    return wrap;
  };
  for (const c of passed) card.append(rowFor(c,false));
  card.append(h("div",{class:"sect",title:"랭킹에서 분리되지만 채점은 끝까지 했다"},"게이트 탈락"));
  if (!gated.length) card.append(h("div",{class:"kv"},"게이트 탈락자 없음"));
  for (const c of gated) card.append(rowFor(c,true));
  view.append(card);
  const R2=parseReportOf();
  if (R2) view.append(h("div",{class:"card",style:"margin-top:16px"},
    h("h2",{title:"줄 단위 대조는 「조건 확인·승인」의 파싱 서랍에 있다"},"이 결과가 나온 파싱"),
    h("div",{class:"diag",style:"margin:0"},
      `파싱 경로 ${R2.parse_mode||"없음"} · OCR 엔진 ${R2.ocr_engine||"없음"} · 줄 ${R2.line_count!=null?R2.line_count:"없음"}개 · LLM 호출 ${R2.llm_calls!=null?R2.llm_calls:"없음"}회`,
      h("div",{},`판정 내역: `+(R2.role_counts?Object.entries(R2.role_counts).map(([k,v])=>`${ROLE_KO[k]||k} ${v}`).join(" · "):"없음")),
      h("div",{},`제외 블록: ${(R2.excluded_blocks&&R2.excluded_blocks.length)?R2.excluded_blocks.join(", "):"없음"}`))));
}

/* ==================== 지원자 상세 — ③ 랭킹 행의 아코디언 ==================== */
async function loadResume(cid){
  if (S.resumes[cid]) return S.resumes[cid];
  const pid=(S.run&&S.run.posting_id)||(S.posting&&S.posting.posting_id)||"";
  const tries=[`/resume/${encodeURIComponent(cid)}?posting_id=${encodeURIComponent(pid)}`,
               `/resume/${encodeURIComponent(cid)}`];
  let got=null;
  for (const p of tries){ try{ got=await api(p); if(got) break; }catch(e){ if(!(e instanceof ApiError)) throw e; } }
  /* 실제 응답: {resume_id, posting_id, text, length, mask_char, masked:[{id,label,categories,start,end}], masked_fields:[]} */
  const norm=(g)=>({ok:true,
    text:(g.text!=null?g.text:(g.resume_text!=null?g.resume_text:null)),
    masked:Array.isArray(g.masked)?g.masked:(g.masked_spans?Object.entries(g.masked_spans).map(([id,sp])=>({id,label:null,categories:id.replace(/-\d+$/,"").split("+"),start:sp.start,end:sp.end})):null),
    masked_fields:Array.isArray(g.masked_fields)?g.masked_fields:null,
    mask_char:g.mask_char||"■"});
  const rec = got==null ? {ok:false, text:null, masked:null, masked_fields:null, mask_char:"■"}
    : (typeof got==="string" ? {ok:true, text:got, masked:null, masked_fields:null, mask_char:"■"} : norm(got));
  S.resumes[cid]=rec;
  return rec;
}
function maskingSummary(rec){
  if (!rec||!rec.ok)
    return "이력서 원문을 받지 못해 무엇을 가렸는지 화면이 확인할 수 없습니다. 엔진은 스코어링 전에 이름·성별·나이·생년월일·출신지·학교명·연락처를 가리도록 설계돼 있습니다(scorer/mask.py).";
  const mc=rec.mask_char||"■";
  const n=rec.masked?rec.masked.length:null;
  if (rec.masked_fields&&rec.masked_fields.length)
    return `채점 전에 가린 항목: ${rec.masked_fields.join(", ")}${n!=null?` (총 ${n}곳)`:""}. 이력서의 ${mc} 가 가린 자리입니다.`;
  if (n){
    const ko=[...new Set(rec.masked.flatMap(m=>m.label?[m.label]:(m.categories||[]).map(k=>MASK_KO[k]||k)))];
    return `채점 전에 가린 자리 ${n}곳 — ${ko.join(", ")}. 이력서의 ${mc} 가 가린 자리입니다.`;
  }
  if (rec.text){
    const hits=(rec.text.match(new RegExp(mc+"+","g"))||[]).length;
    return hits? `가린 항목 목록을 응답에서 받지 못했습니다. 본문에서 ${mc} 로 가려진 자리는 ${hits}곳입니다.`
               : `가린 항목 목록을 응답에서 받지 못했고, 본문에 ${mc} 표시도 없습니다. 마스킹 여부를 화면이 확인할 수 없습니다.`;
  }
  return "이력서 본문이 비어 있어 마스킹 여부를 확인할 수 없습니다.";
}
/* 가린 자리를 목록으로 — 「무엇을 가리고 채점했는가」(step9 4번) */
function maskingDetail(rec){
  if (!rec||!rec.ok||!rec.masked||!rec.masked.length) return null;
  const box=h("div",{class:"diag",style:"margin-top:8px"});
  box.append(h("div",{title:"마스킹된 값은 화면에 되살리지 않는다 (블라인드 채용 금지 항목)"},`가린 자리 ${rec.masked.length}곳`));
  for (const m of rec.masked)
    box.append(h("div",{}, h("span",{class:"mono"},String(m.id)), " · ",
      (m.label || (m.categories||[]).map(k=>MASK_KO[k]||k).join("·") || "종류 미기록"),
      " · 문자 ", h("span",{class:"mono"},`${m.start}–${m.end}`)));
  return box;
}
function candidateDetail(C){
  const G=activeGraph();
  const eidx=evidenceIndex(G);
  const cidx=new Map((((G&&G.criteria)||[])).map(c=>[c.id,c]));
  const ridx=reqIndex(G&&G.requirements);
  const root=h("div",{});
  const maskBanner=h("div",{class:"banner info",style:"margin:0 0 10px"},h("b",{},"마스킹"),"이력서를 불러오는 중…");
  const maskSlot=h("div",{});
  root.append(maskBanner, maskSlot);
  if (C.gate && !C.gate.passed) root.append(h("div",{class:"banner danger",
    title:"랭킹에서는 분리되지만 항목별 채점은 끝까지 했다 — 게이트가 틀렸을 때 되돌릴 근거를 남기기 위해서다"},
    h("b",{},"게이트 탈락"),
    ((C.gate.reasons&&C.gate.reasons.length)?C.gate.reasons.join(" · "):"사유 기록 없음")));

  const resumePane=h("div",{class:"resume",style:"max-height:300px"},"이력서 원문을 불러오는 중…");
  /* 근거 사슬의 마지막 마디(공고 좌표)를 여기서도 본다. ②의 서랍 뷰어와 같은 factory다 */
  const vw=makeViewer({height:"300px"});
  let resumeRec=null;
  function renderResume(hotSpan){
    resumePane.textContent="";
    if(!resumeRec||!resumeRec.ok||resumeRec.text==null){
      resumePane.append(h("div",{class:"kv"},"이력서 원문 없음 (GET /resume 404) — 하이라이트 불가"));
      return;
    }
    const text=resumeRec.text;
    const spans=[];
    for (const a of (C.breakdown||[])) for (const id of (a.evidence_ids||[])){ const e=eidx.get(id); if(e&&e.span) spans.push(e.span); }
    spans.sort((a,b)=>a.start-b.start);
    let pos=0;
    for (const sp of spans){
      if (sp.start<pos || sp.start>text.length) continue;
      resumePane.append(text.slice(pos,sp.start));
      const m=h("mark",{class:hotSpan&&sp.start===hotSpan.start?"hot":""},text.slice(sp.start,sp.end));
      resumePane.append(m); pos=Math.min(sp.end,text.length);
      if (hotSpan&&sp.start===hotSpan.start) setTimeout(()=>resumePane.scrollTo({top:Math.max(0,m.offsetTop-100),behavior:"smooth"}),30);
    }
    resumePane.append(text.slice(pos));
  }
  const bboxWarn=h("div",{});
  function warnNoBBox(){ if(bboxWarn.childElementCount) return;
    bboxWarn.append(h("div",{class:"banner warn"},h("b",{},"공고 좌표 없음"))); }
  function onQuote(evd, critId){
    renderResume(evd.span);
    const crit=cidx.get(critId);
    const req=crit?ridx.get(crit.requirement_id):null;
    if (req&&req.source_bbox){
      vw.focusBBox(req.source_bbox);
      /* ②의 서랍 뷰어에도 같은 자리를 표시해 둔다 — 화면을 옮겨도 연결이 끊기지 않는다 */
      if (viewers.main) { try{ viewers.main.focusBBox(req.source_bbox,false); }catch(e){} }
      S.drawerOpen=true;
    } else warnNoBBox();
  }

  /* 점수 표 */
  const tblCard=h("div",{},h("div",{class:"sect",
    title:"원점수 척도가 층마다 다르다 — 사실 0~1 · 판단 1~5 · 게이트 통과/탈락. 막대는 weighted/만점 비율이다"},"항목별 점수"));
  const tb=h("table",{class:"t"},
    h("tr",{},h("th",{},"항목"),h("th",{},"층"),h("th",{},"원점수"),h("th",{},"가중 점수"),h("th",{},"만점"),h("th",{style:"width:110px"},"비율"),h("th",{},"근거")));
  for (const a of (C.breakdown||[])){
    const ratio=a.max_weighted?a.weighted/a.max_weighted:0;
    const evs=(a.evidence_ids||[]).map(id=>eidx.get(id)).filter(Boolean);
    const missing=(a.evidence_ids||[]).length-evs.length;
    const det=h("tr",{hidden:true},h("td",{colspan:"7",style:"padding:0 8px 12px"},
      h("div",{class:"rationale"},a.rationale||"근거 문단 없음"),
      h("div",{style:"margin-top:8px;display:flex;flex-wrap:wrap;gap:6px"},
        ...evs.map(e=>h("button",{class:"qlink",title:"이력서 문자 오프셋 "+e.span.start+"–"+e.span.end,
          onclick:()=>onQuote(e,a.criterion_id)},"인용 "+e.id+" 「"+String(e.quote).slice(0,34)+(String(e.quote).length>34?"…":"")+"」")),
        (!evs.length && !(a.evidence_ids||[]).length)?h("span",{class:"kv"},"이 항목에 연결된 이력서 인용이 없습니다"):null,
        missing>0?h("span",{class:"kv",style:"color:var(--warning)"},`근거 id ${missing}개가 그래프에 없습니다`):null),
      h("div",{class:"kv",style:"margin-top:8px"},"공고 조건: ",
        (()=>{const c=cidx.get(a.criterion_id); const r=c?ridx.get(c.requirement_id):null;
          return r? h("span",{class:"mono"},`${r.id} (${KIND_KO[r.kind]||r.kind})`) : h("span",{class:"miss"},"그래프에서 못 찾음");})())));
    const row=h("tr",{style:"cursor:pointer"},
      h("td",{},a.label," ",egBadge(a.evidence_grade)," ",statusChip(a.review_status)),
      h("td",{},h("span",{title:LAYER_KO[a.layer]},LAYER_SHORT[a.layer]||a.layer),
        h("div",{class:"kv",style:"font-size:10.5px"},LAYER_SCALE[a.layer]||"")),
      h("td",{class:"num"},`${a.raw} / ${a.layer==="judgment"?5:1}`),
      h("td",{class:"num"},Number(a.weighted).toFixed(2)),
      h("td",{class:"num"},String(a.max_weighted)),
      h("td",{},h("div",{class:"minibar"},h("i",{style:`width:${Math.max(0,Math.min(100,ratio*100)).toFixed(0)}%`}))),
      h("td",{},evs.length?h("span",{class:"kv"},evs.map(e=>e.id).join(", ")):h("span",{class:"kv"},"—")));
    row.addEventListener("click",()=>{det.hidden=!det.hidden;});
    tb.append(row,det);
  }
  if (!(C.breakdown||[]).length) tb.append(h("tr",{},h("td",{colspan:"7",class:"kv"},"항목별 점수가 없습니다")));
  tblCard.append(h("div",{class:"tscroll"},tb));
  const right=h("div",{},
    h("div",{class:"sect",title:"인용을 누르면 그 구간이 하이라이트된다"},"이력서 원문 (마스킹)"),resumePane,
    h("div",{class:"sect",title:"인용을 누르면 그 점수의 근거가 된 조건 위치에 네모가 쳐진다"},"공고 이미지"),bboxWarn,vw.root);
  root.append(h("div",{class:"grid2b"},tblCard,right));
  /* 뷰어는 DOM에 붙은 뒤 layout이 돌아야 한다 */
  setTimeout(()=>vw.mount(S.trace,S.imgUrl),0);
  loadResume(C.candidate_id).then(rec=>{
    resumeRec=rec;
    maskBanner.textContent=""; maskBanner.append(h("b",{},"마스킹"), maskingSummary(rec));
    const det=maskingDetail(rec);
    if (det){
      const toggle=h("button",{class:"btn sm",style:"margin-bottom:10px",onclick:()=>{det.hidden=!det.hidden;}},"가린 자리 목록");
      det.hidden=true; maskSlot.append(toggle,det);
    }
    renderResume(null);
  }).catch(e=>{ console.error(e); resumeRec={ok:false}; maskBanner.textContent="";
    maskBanner.append(h("b",{},"마스킹"), maskingSummary(null)); renderResume(null); });
  return root;
}

/* ============================ 부팅 ============================ */
async function boot(){
  if (USE_MOCK){ $("#mockbar").hidden=false; initMock(); }
  /* 새로고침 복원 — **다시 채점하지 않는다.** `POST /prepare`도 부르지 않는다:
     그건 OCR과 LLM 헤더 분류를 다시 돌리는 일이라 새로고침에 비용이 붙는다.
     랭킹·상세에 필요한 조건·루브릭·근거는 `RunResult.graph`에 전부 들어 있다. */
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){}
  if (saved&&saved.run_id){
    try{
      const run=await api("/runs/"+encodeURIComponent(saved.run_id));
      S.run=run;
      try{ S.postings=await api("/postings"); S.posting=(S.postings||[]).find(p=>p.posting_id===run.posting_id)||null; }catch(e){}
      const raw=await apiOptional("/trace/"+encodeURIComponent(run.posting_id));
      S.trace=normalizeTrace(raw,run.graph)||traceFromGraph(run.graph); S.traceMiss=LAST_OPTIONAL_MISS;
      S.imgUrl=imageUrl(run.posting_id);
      S.visited=new Set([1,2,3]); S.step=3;
    }catch(e){ try{localStorage.removeItem(LS_KEY);}catch(_){} }
  }
  render();
}
boot();
</script>
